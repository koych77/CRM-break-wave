name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for file in src/*.js public/assets/*.js; do node --check "$file"; done

      - name: Run tests
        run: npm test

      - name: Build worker
        run: npx wrangler deploy --dry-run --outdir dist
